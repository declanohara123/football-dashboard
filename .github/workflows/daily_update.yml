name: update-dataset

on:
  schedule:
    # Runs at 09:00 UTC every day
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright
          playwright install chromium --with-deps
          
      - name: Run Playwright Scraper
        run: python scraper.py
        
      - name: Commit and Push Updated CSV to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Championship metrics from Opta"
          file_pattern: "data/expected_positions.csv"

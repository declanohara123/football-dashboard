name: Daily Football Data Auto-Update

on:
  schedule:
    # Runs every day at 09:00 UTC (09:00 AM)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to manually trigger the update from GitHub anytime

jobs:
  update-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/expected_positions.csv
          git commit -m "Auto-update matchday metrics [skip ci]" || exit 0
          git push

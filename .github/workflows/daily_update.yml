name: Daily Football Data Auto-Update

on:
  schedule:
    # 08:00 UTC = 09:00 AM UK local time during BST
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml html5lib playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Playwright Scraper
        run: python scraper.py

      - name: Commit and Push Updated CSV to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/expected_positions.csv
          git commit -m "Auto-update Championship metrics from Opta [skip ci]" || exit 0
          git push

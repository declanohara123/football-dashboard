name: Daily Football Data Auto-Update

on:
  schedule:
    # 08:00 UTC = 09:00 AM UK local time during BST
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml html5lib playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Clean Python Cache & Run Playwright Scraper
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} +
          python -B scraper.py

      - name: Hard Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add data/expected_positions.csv
          if git status --porcelain | grep -q "data/expected_positions.csv"; then
            git commit -m "Auto-update Championship metrics from Opta [skip ci]"
            git push origin main --force
            echo "Successfully pushed updated CSV to main!"
          else
            echo "No changes detected in data/expected_positions.csv."
          fi

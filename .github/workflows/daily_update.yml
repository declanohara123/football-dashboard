name: update-dataset

on:
  schedule:
    # Runs at 09:00 UTC every day
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history to prevent git rebase/push conflicts

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright
          playwright install chromium --with-deps
          
      - name: Clean Python Cache & Run Playwright Scraper
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} +
          python scraper.py
        
      - name: Commit and Push Updated CSV to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/expected_positions.csv
          
          # Only create a commit if there are actual data changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update Championship metrics from Opta [skip ci]"
          
          # Push directly from the current HEAD to the remote main branch
          git push origin HEAD:main
